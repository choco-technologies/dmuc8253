; LILYGO T-Deck Pro: the 3.1" e-paper (GDEQ031T10, UC8253, 240x320, black and white) on GP-SPI2, the pins of the vendor's example:
;   SCLK = GPIO36 (PC4), MOSI = GPIO33 (PC1), no MISO, CS = GPIO34 (PC2), D/C = GPIO35 (PC3), BUSY = GPIO37 (PC5), no reset line (V1.0 of the
;   board; the controller is reset by command. V1.1 has one: GPIO16 = PB0, add a [epd_reset] section with friend_role=reset and reset=yes).
; GPIO0..15 are port A, 16..31 port B, 32..47 port C, 48 port D of dmgpio (pin=PC2 is GPIO34).
;
; The bus is shared: the SD card (CS = GPIO48 = PD0) and the LoRa radio (CS = GPIO3 = PA3) sit on the same SCK/MOSI. A device that is not
; selected must not listen: their chip selects are held high (pull-ups of the pads, mode=input) before the bus moves. dmgpio does not set
; the level of an output at the start, so they are not outputs here; whoever drives the card or the radio takes the pins over.
;
; One friends_group: dmdevfs tells every driver of the group about the others, and the friend_role says who is who. The display is the last
; section (the order of the sections is the order of the creation and, reversed, of the teardown). dmgpio and dmspi must be loaded, and so
; must dmdma (the transfers of dmspi go by DMA) - dmdma driver=mcu/esp32s3.ini.
; Splash screen: the logo comes from $SPLASH_LOGO (dmod-boot puts it in /eviews/splash_logo.dmvir) on a white screen (clear_color).

[lora_cs_parked]
driver_name=dmgpio
driver_order=2
pin=PA3
mode=input
pull=up

[sd_cs_parked]
driver_name=dmgpio
driver_order=2
pin=PD0
mode=input
pull=up

[epd_cs]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=chip_select
pin=PC2
mode=output
state=high

[epd_dc]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=dc
pin=PC3
mode=output
state=low

[epd_busy]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=busy
pin=PC5
mode=input

[epd_spi]
driver_name=dmspi
driver_order=2
friends_group=epd
friend_role=spi
instance=2
role=master
baudrate=10000000
mode=0
nss_mode=soft
sck_pin=36
mosi_pin=33

[epd]
driver_name=dmuc8253
driver_order=3
friends_group=epd
width=240
height=320
rotation=90
partial=yes
full_refresh_interval=20
clear_color=0xFFFFFFFF

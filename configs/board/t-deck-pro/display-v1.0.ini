; LILYGO T-Deck Pro V1.0 (no reset line of the panel; V1.1 has GPIO16: display.ini): the 3.1" e-paper (GDEQ031T10, UC8253, 240x320, black and white) on GP-SPI2, the pins of the vendor's example:
;   SCLK = GPIO36 (PC4), MOSI = GPIO33 (PC1), no MISO, CS = GPIO34 (PC2), D/C = GPIO35 (PC3), BUSY = GPIO37 (PC5); no reset line (the controller is reset by command).
; GPIO0..15 are port A, 16..31 port B, 32..47 port C, 48 port D of dmgpio (pin=PC2 is GPIO34).
;
; The bus is shared with the SD card (CS = GPIO48 = PD0) and the LoRa radio (SX1262: CS = GPIO3 = PA3, reset = GPIO4 = PA4, power =
; GPIO46 = PC14). Both must be deselected (CS high) before the bus moves, and the radio must be POWERED: an unpowered SX1262 loads SCK and
; MOSI through its input protection, so a clock from the controller (MHz) does not reach the display - a refresh then shows the old
; picture (measured: no SCK edges on GPIO36 at 4 MHz with the radio off, all of them with it on). The lines are outputs with their level at
; the start (state=); whoever drives the card or the radio later takes the pins over.
;
; One friends_group: dmdevfs tells every driver of the group about the others, and the friend_role says who is who. The display is the last
; section (the order of the sections is the order of the creation and, reversed, of the teardown). dmgpio and dmspi must be loaded, and so
; must dmdma (the transfers of dmspi go by DMA) - dmdma driver=mcu/esp32s3.ini.
; The panel is portrait in the device: rotation=0. Splash screen: the logo comes from $SPLASH_LOGO (dmod-boot puts it in
; /eviews/splash_logo.dmvir) on a white screen (clear_color).

[lora_power]
driver_name=dmgpio
driver_order=2
pin=PC14
mode=output
state=high

[lora_cs]
driver_name=dmgpio
driver_order=2
pin=PA3
mode=output
state=high

[lora_reset]
driver_name=dmgpio
driver_order=2
pin=PA4
mode=output
state=high

[sd_cs]
driver_name=dmgpio
driver_order=2
pin=PD0
mode=output
state=high

[epd_cs]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=chip_select
pin=PC2
mode=output
state=high

[epd_dc]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=dc
pin=PC3
mode=output
state=low

[epd_busy]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=busy
pin=PC5
mode=input

[epd_spi]
driver_name=dmspi
driver_order=2
friends_group=epd
friend_role=spi
instance=2
role=master
baudrate=4000000
mode=0
nss_mode=soft
sck_pin=36
mosi_pin=33

[epd]
driver_name=dmuc8253
driver_order=3
friends_group=epd
width=240
height=320
rotation=0
partial=yes
full_refresh_interval=20
clear_color=0xFFFFFFFF
; The GUI (dmview) draws RGB565: the driver makes the 1-bit picture of what is presented, white from the luminance 128 (a higher threshold
; makes the text bolder, a lower one thins the white text on black).
pixel_format=rgb565
threshold=128
